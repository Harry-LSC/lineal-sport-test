name: Deploy Bannerman revision

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-bannerman.yml"
      - ".bannerman-deploy/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore approved Bannerman files
        run: python .bannerman-deploy/deploy.py

      - name: Install workbook reader
        run: python -m pip install --upgrade openpyxl

      - name: Validate workbook and rebuild JSON
        run: python build_data.py

      - name: Commit approved Bannerman release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charles-bannerman-belt.html LSC_Update_System.xlsx data/sports-data.json
          if git diff --cached --quiet; then
            echo "Release files are already up to date."
            exit 0
          fi
          git commit -m "Publish revised Charles Bannerman Belt lineage"
          git push
