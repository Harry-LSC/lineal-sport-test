name: Remove homepage rule numbers

on:
  push:
    paths:
      - '.github/workflows/remove-home-rule-numbers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Complete Rules numbers
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '.full-rule{display:grid;grid-template-columns:34px minmax(0,1fr);gap:13px;padding:19px 0;border-bottom:1px solid var(--line-soft)}\n.full-rule-num{font:600 18px/1 "Cormorant Garamond",serif;color:var(--gold-bright);padding-top:2px}'
          new_css = '.full-rule{padding:19px 0;border-bottom:1px solid var(--line-soft)}'
          if text.count(old_css) != 1:
              raise SystemExit('Expected desktop full-rule CSS exactly once')
          text = text.replace(old_css, new_css)

          old_mobile = '@media(max-width:760px){.full-rules-panel{padding:26px 20px 22px}.full-rules-grid{grid-template-columns:1fr}.full-rules-title{font-size:30px}.full-rule{grid-template-columns:30px minmax(0,1fr)}}'
          new_mobile = '@media(max-width:760px){.full-rules-panel{padding:26px 20px 22px}.full-rules-grid{grid-template-columns:1fr}.full-rules-title{font-size:30px}}'
          if text.count(old_mobile) != 1:
              raise SystemExit('Expected mobile full-rule CSS exactly once')
          text = text.replace(old_mobile, new_mobile)

          pattern = r'<div class="full-rule"><div class="full-rule-num">0[1-6]</div><div>(.*?)</div></div>'
          text, count = re.subn(pattern, r'<div class="full-rule"><div>\1</div></div>', text)
          if count != 6:
              raise SystemExit(f'Expected 6 numbered rules, found {count}')
          if 'full-rule-num' in text:
              raise SystemExit('Number class still present after patch')
          if text.count('<div class="full-rule">') != 6:
              raise SystemExit('Rule count changed unexpectedly')
          if 'id="full-rules"' not in text or 'href="#full-rules"' not in text:
              raise SystemExit('Rules anchor/navigation broken')

          path.write_text(text, encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remove-home-rule-numbers.yml
          git add index.html .github/workflows/remove-home-rule-numbers.yml
          git diff --cached --check
          git commit -m "Remove homepage rule numbers"
          git push
