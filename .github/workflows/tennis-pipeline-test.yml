name: Tennis pipeline regression test

on:
  push:
    branches:
      - tennis-pipeline-test
    paths:
      - "seed_tennis_test_updates.py"
      - ".github/workflows/tennis-pipeline-test.yml"

permissions:
  contents: write

jobs:
  regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: python -m pip install --upgrade openpyxl

      - name: Seed synthetic tennis updates
        run: python seed_tennis_test_updates.py

      - name: Run tennis builder
        run: python build_tennis_data.py

      - name: Assert expected synthetic state
        run: |
          python - <<'PY'
          import json
          data = json.load(open("data/tennis-data.json", encoding="utf-8"))
          men = next(x for x in data["lineages"] if x["lineage"] == "Men's Singles")
          assert men["current_holder"] == "Test Challenger", men
          assert men["current_defences"] == 1, men
          assert men["transfers"] == 1611, men
          assert men["total_defences"] == 4074, men
          assert men["played_title_matches"] == 5685, men
          updates = [x for x in data["lineage_updates"] if x["lineage"] == "Men's Singles"]
          assert [x["outcome"] for x in updates[-3:]] == ["Defence", "Transfer", "Defence"], updates[-3:]
          print("Synthetic regression assertions passed.")
          PY

      - name: Commit test workbook and JSON for inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LSC_Tennis_Update_System.xlsx data/tennis-data.json
          git commit -m "Seed tennis pipeline regression test"
          git push
