name: Publish Sri Lanka flag fix
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-sri-lanka-flag.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Sri Lanka flag
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/1/11/Flag_of_Sri_Lanka.svg' \
            -o sri-lanka.svg
          test -s sri-lanka.svg
          grep -qi '<svg' sri-lanka.svg
      - name: Patch Sri Lanka flag renderers sitewide
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          asset = '<image href="sri-lanka.svg" x="0" y="0" width="60" height="36" preserveAspectRatio="xMidYMid meet"/>'
          custom = re.compile(r"(?P<indent>[ \t]*)'Sri Lanka'\s*:\s*\(\)\s*=>\s*`.*?`,(?=\s*\n[ \t]*'Bangladesh'\s*:)", re.S)
          total = 0
          touched = []

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              def repl(m):
                  global total
                  total += 1
                  return f"{m.group('indent')}'Sri Lanka': () => `{asset}`,"

              text = custom.sub(repl, text)

              if path.name == 'cricket.html' and 'sri-lanka.svg' not in text:
                  ireland = "    'Ireland':'<image href=\"ireland-cricket.png\" x=\"0\" y=\"0\" width=\"60\" height=\"36\" preserveAspectRatio=\"xMidYMid meet\"/>'"
                  if ireland not in text:
                      raise SystemExit('cricket.html: Ireland flag anchor not found')
                  text = text.replace(
                      ireland,
                      "    'Sri Lanka':'<image href=\"sri-lanka.svg\" x=\"0\" y=\"0\" width=\"60\" height=\"36\" preserveAspectRatio=\"xMidYMid meet\"/>',\n" + ireland,
                      1,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  touched.append(path.name)

          if total == 0:
              raise SystemExit('No custom Sri Lanka flag renderers were replaced')

          # The old miniature renderer included this distinctive fake circular lion mark.
          forbidden = 'circle cx=\\"42\\" cy=\\"18\\" r=\\"8\\"'
          leftovers = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if forbidden in text:
                  leftovers.append(path.name)
          if leftovers:
              raise SystemExit('Old Sri Lanka miniature renderer remains in: ' + ', '.join(leftovers))

          print('Sri Lanka flag replacements:', total)
          print('Touched:', ', '.join(touched))
          PY
      - name: Validate page scripts and asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          svg = Path('sri-lanka.svg').read_text(encoding='utf-8')
          if '<svg' not in svg.lower():
              raise SystemExit('sri-lanka.svg is not valid SVG text')

          refs = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if 'Sri Lanka' in text and 'const FLAGS' in text and 'sri-lanka.svg' in text:
                  refs.append(path.name)
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
              for script in scripts:
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                      f.write(script)
                      tmp = f.name
                  subprocess.run(['node','--check',tmp], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          if not refs:
              raise SystemExit('No HTML pages reference sri-lanka.svg')
          print('Pages using official Sri Lanka asset:', ', '.join(refs))
          PY
      - name: Commit production patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-sri-lanka-flag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Sri Lanka flag sitewide"
          git push
