name: Publish homepage rules update

on:
  push:
    paths:
      - '.github/workflows/publish-home.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage
        run: python tools/publish_home.py
      - name: Commit homepage and clean temporary files
        run: |
          rm .github/workflows/publish-home.yml
          rm tools/publish_home.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/publish-home.yml tools/publish_home.py
          git commit -m "Update homepage rules and copy"
          git push
