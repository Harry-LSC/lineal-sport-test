name: Assemble tennis preview pages

on:
  push:
    branches:
      - tennis-publication-preview
    paths:
      - ".tennis-page-src/**"
      - "assemble_tennis_pages.py"
      - ".github/workflows/assemble-tennis-pages.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble frozen tennis pages
        run: python assemble_tennis_pages.py
      - name: Commit assembled pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mens-tennis.html womens-tennis.html
          if git diff --cached --quiet; then
            echo "Tennis pages are already current."
            exit 0
          fi
          git commit -m "Assemble tennis preview pages"
          git push
