name: Publish Ireland cricket badge fix
on:
  push:
    paths:
      - '.github/workflows/publish-ireland-badge.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved Ireland badge
        run: python .github/patch_ireland_badge.py
      - name: Validate badge and page scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess, tempfile
          targets = [
              'cricket.html','charles-bannerman-belt.html','myrtle-maclagan-medal.html',
              'john-edrich-jug.html','tina-macpherson-trophy.html','rebecca-rolls-ribbon.html',
              'ricky-ponting-ribbon.html','yusuf-pathan-plate.html'
          ]
          expected='83ef32525c8a0cfb2c42e419ab2339c40f9175fd1178f659d0a42e676ff42e2b'
          actual=hashlib.sha256(Path('ireland-cricket.png').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'asset hash mismatch: {actual}')
          for name in targets:
              text=Path(name).read_text(encoding='utf-8')
              for forbidden in ('169B62','FF883E','🇮🇪'):
                  if forbidden.lower() in text.lower():
                      raise SystemExit(f'{name}: forbidden token remains: {forbidden}')
              if 'ireland-cricket.png' not in text:
                  raise SystemExit(f'{name}: approved badge reference missing')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
              for i, script in enumerate(scripts):
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                      f.write(script)
                      tmp=f.name
                  subprocess.run(['node','--check',tmp],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              print(f'{name}: OK ({len(scripts)} inline scripts)')
          print('approved asset sha256:', actual)
          PY
      - name: Commit production patch and clean helper files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patch_ireland_badge.py .github/ireland-cricket-badge.b64 .github/workflows/publish-ireland-badge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cricket.html charles-bannerman-belt.html myrtle-maclagan-medal.html john-edrich-jug.html tina-macpherson-trophy.html rebecca-rolls-ribbon.html ricky-ponting-ribbon.html yusuf-pathan-plate.html ireland-cricket.png .github/patch_ireland_badge.py .github/ireland-cricket-badge.b64 .github/workflows/publish-ireland-badge.yml
          git commit -m "Fix Ireland cricket badge sitewide"
          git push
