name: Build tennis data

on:
  push:
    branches:
      - tennis-publication-preview
    paths:
      - "LSC_Tennis_Update_System.xlsx"
      - "create_tennis_workbook.py"
      - "migrate_tennis_workbook_players.py"
      - "build_tennis_data.py"
      - ".github/workflows/build-tennis-data.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: python -m pip install --upgrade openpyxl pycountry

      - name: Create initial tennis workbook when absent
        run: python create_tennis_workbook.py

      - name: Add player representation lookup
        run: python migrate_tennis_workbook_players.py

      - name: Validate tennis workbook and build JSON
        run: python build_tennis_data.py

      - name: Commit generated tennis files
        run: |
          if [ -z "$(git status --porcelain -- LSC_Tennis_Update_System.xlsx data/tennis-data.json)" ]; then
            echo "Tennis workbook and JSON are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LSC_Tennis_Update_System.xlsx data/tennis-data.json
          git commit -m "Initialize generated tennis update data"
          git push
