name: Clean Yusuf Pathan footer
on:
  push:
    paths:
      - '.github/workflows/clean-yusuf-footer.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove public debug footer text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('yusuf-pathan-plate.html')
          s=p.read_text()
          old="""    const footer=document.getElementById('live-footer-status');\n    if(footer){const nt=live.next_defence?`Next defence ${prettyRange(live.next_defence.date,live.next_defence.end_date)} vs ${live.next_defence.opponent}.`:'Next defence TBD.';footer.innerHTML=`Live Yusuf Pathan state loaded from sports-data.json · ${esc(nt)} · Pathan Y1`;}\n  }catch(err){\n    console.error('Live Yusuf Pathan data hydration failed:',err);\n    const footer=document.getElementById('live-footer-status');\n    if(footer)footer.textContent='Live data failed to load · Pathan Y1';\n  }\n"""
          new="""  }catch(err){\n    console.error('Live Yusuf Pathan data hydration failed:',err);\n  }\n"""
          if old not in s:
              raise SystemExit('Expected Yusuf footer block not found; refusing to modify file')
          s=s.replace(old,new,1)
          # Remove the now-unused visible status element if present, preserving surrounding footer.
          import re
          s,n=re.subn(r'\s*<[^>]+id=["\']live-footer-status["\'][^>]*>.*?</[^>]+>','',s,count=1,flags=re.S)
          p.write_text(s)
          print('status element removed:', n)
          PY
      - name: Validate change
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('yusuf-pathan-plate.html').read_text()
          forbidden=['Live Yusuf Pathan state loaded','Live data failed to load · Pathan Y1','live-footer-status']
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('Still present: '+repr(bad))
          for required in ['sports-data.json','Yusuf Pathan Plate','</html>']:
              if required not in s: raise SystemExit('Required content missing: '+required)
          print('validation passed')
          PY
      - name: Commit page and remove temporary workflow
        run: |
          rm .github/workflows/clean-yusuf-footer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yusuf-pathan-plate.html .github/workflows/clean-yusuf-footer.yml
          git commit -m 'Clean Yusuf Pathan public footer'
          git push
