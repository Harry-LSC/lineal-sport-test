name: Fix Bannerman breadcrumb

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-bannerman-breadcrumb.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch breadcrumb links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('charles-bannerman-belt.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<!-- OFFLINE REVIEW BUILD: revised Bannerman lineage; not for publication -->\n\n', '', 1)
          old = '<div class="wrap" style="padding-top:22px"><div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--cricket-bright)">Lineal Sport Championship / Cricket</div></div>'
          new = '<div class="wrap" style="padding-top:22px"><div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--cricket-bright)"><a href="index.html" aria-label="Lineal Sport Championship home">Lineal Sport Championship</a> / <a href="cricket.html" aria-label="Cricket championship hub">Cricket</a></div></div>'
          if old not in s:
              raise SystemExit('Expected breadcrumb markup not found; refusing to modify file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charles-bannerman-belt.html
          git commit -m "Fix Bannerman breadcrumb links"
          git push
