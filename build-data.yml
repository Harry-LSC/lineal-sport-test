name: Build sports data

on:
  push:
    branches:
      - main
    paths:
      - "LSC_Update_System.xlsx"
      - "build_data.py"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: python -m pip install --upgrade openpyxl

      - name: Validate workbook and build JSON
        run: python build_data.py

      - name: Commit generated JSON
        run: |
          if git diff --quiet -- data/sports-data.json; then
            echo "sports-data.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sports-data.json
          git commit -m "Update generated sports data"
          git push
